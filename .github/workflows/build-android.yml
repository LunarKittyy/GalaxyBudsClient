name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload
      run: dotnet workload install android

    - name: Build and Publish Android APK
      run: |
        cd GalaxyBudsClient.Android
        dotnet publish -c Release -f net10.0-android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GalaxyBudsClient-Android-APK
        path: GalaxyBudsClient.Android/bin/Release/net10.0-android/**/publish/*.apk
        if-no-files-found: warn
