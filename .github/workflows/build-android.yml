name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload
      run: dotnet workload install android

    - name: Fix invalid XML entities in i18n AXAML files
      run: |
        for f in GalaxyBudsClient/i18n/*.axaml; do
          perl -i -pe 's/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/&amp;/g' "$f"
        done

    - name: Restore dependencies
      run: dotnet restore GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj

    - name: Build and Publish Android APK
      run: |
        cd GalaxyBudsClient.Android
        dotnet publish -c Release -f net10.0-android36.1 --no-restore -p:BuildInParallel=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GalaxyBudsClient-Android-APK
        path: GalaxyBudsClient.Android/bin/Release/net10.0-android36.1/**/publish/*.apk
        if-no-files-found: warn
